# =====================================================================
# Mobile Showroom Inventory Management System - Application Configuration
# =====================================================================
# This file configures the Spring Boot application behavior including
# database connection, JPA settings, and template engine options.
# =====================================================================

# ----- Application Name -----
spring.application.name=Mobile Showroom Inventory

# ----- Server Configuration -----
# The application will run on port 8080 (default)
# Access the app at: http://localhost:8080
server.port=8080

# =====================================================================
# DATABASE CONFIGURATION - H2 (Active by Default)
# =====================================================================
# H2 is a lightweight embedded database that requires no installation.
# Data is stored in a local file at ./data/mobile_showroom_db
# This is ideal for development, testing, and academic projects.
# =====================================================================

# H2 Database Connection URL
# - jdbc:h2:file: stores data persistently in a file
# - Data files will be created in the 'data' folder of the project root
spring.datasource.url=jdbc:h2:file:./data/mobile_showroom_db

# H2 JDBC Driver Class
spring.datasource.driverClassName=org.h2.Driver

# H2 Default Credentials (sa with no password)
spring.datasource.username=sa
spring.datasource.password=

# H2 Web Console - accessible at http://localhost:8080/h2-console
# Useful for directly browsing and querying the database during development
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# =====================================================================
# JPA / HIBERNATE CONFIGURATION
# =====================================================================

# DDL Auto Strategy:
# - 'update': Hibernate automatically creates/updates tables based on entities
# - Other options: 'create' (drop & recreate), 'create-drop', 'validate', 'none'
spring.jpa.hibernate.ddl-auto=update

# Show SQL statements in the console (helpful for debugging)
spring.jpa.show-sql=true

# Format the SQL output for readability
spring.jpa.properties.hibernate.format_sql=true

# Hibernate Dialect - tells Hibernate how to generate SQL for H2
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# =====================================================================
# THYMELEAF CONFIGURATION
# =====================================================================

# Disable template caching during development for instant changes
# Set to 'true' in production for better performance
spring.thymeleaf.cache=false

# =====================================================================
# TO SWITCH TO MySQL DATABASE
# =====================================================================
# Follow these steps to use MySQL instead of H2:
