<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>403 Access Denied - INVENTRA RBAC</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<div th:replace="~{fragments/sidebar :: sidebar}"></div>

<div class="app-main">
    <div th:replace="~{fragments/header :: header('Access Restricted (HTTP 403 Forbidden)')}"></div>

    <div class="page-container d-flex align-items-center justify-content-center">
        <div class="content-card text-center py-5 px-4" style="max-width: 620px; width: 100%;">
            <div class="metric-icon-box icon-red mx-auto mb-3" style="width: 68px; height: 68px; font-size: 2rem; border-radius: 50%;">
                <i class="bi bi-shield-lock-fill"></i>
            </div>
            <span class="badge bg-danger-subtle text-danger border border-danger-subtle mb-2 px-3 py-1">
                HTTP 403 FORBIDDEN &bull; RBAC SECURITY ENFORCEMENT
            </span>
            <h4 class="fw-bold text-dark mb-2">Unauthorized Module or Operation</h4>
            <p class="text-secondary mb-4" th:text="${accessDeniedMessage ?: 'Access Denied: Your assigned role does not have permission to view or perform this operation.'}">
                Access Denied: Your assigned role does not have permission to view or perform this operation.
            </p>

            <div th:if="${currentUser != null}" class="border rounded-3 p-3 bg-light text-start mb-4 small">
                <div class="d-flex align-items-center justify-content-between mb-1">
                    <span class="text-muted">Authenticated Employee:</span>
                    <strong class="text-dark" th:text="${currentUser.fullName} + ' (@' + ${currentUser.username} + ')'">User</strong>
                </div>
                <div class="d-flex align-items-center justify-content-between">
                    <span class="text-muted">Assigned RBAC Role:</span>
                    <span class="role-badge" th:classappend="${currentUser.role.badgeClass}" th:text="${currentUser.role.displayName}">Role</span>
                </div>
            </div>

            <div class="d-flex flex-wrap justify-content-center gap-2">
                <a th:href="@{/dashboard}" class="btn btn-primary px-4">
                    <i class="bi bi-grid-1x2-fill me-1"></i> Return to Dashboard
                </a>
                <a href="javascript:history.back()" class="btn btn-outline-secondary px-3">
                    <i class="bi bi-arrow-left me-1"></i> Go Back
                </a>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
