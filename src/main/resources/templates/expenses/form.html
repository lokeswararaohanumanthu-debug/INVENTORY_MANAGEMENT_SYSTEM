<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${isNew} ? 'Record Expense - INVENTRA' : 'Edit Expense - INVENTRA'">Expense Form</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<div th:replace="~{fragments/sidebar :: sidebar}"></div>

<div class="app-main">
    <div th:replace="~{fragments/header :: header(${isNew} ? 'Record New Expense' : 'Edit Expense')}"></div>

    <div class="page-container">
        <div class="row justify-content-center">
            <div class="col-lg-7">
                <div class="content-card">
                    <div class="content-card-header">
                        <h5 class="content-card-title">
                            <i class="bi bi-wallet2 text-primary me-2"></i>
                            <span th:text="${isNew} ? 'Showroom Operating Expense' : 'Update Expense Entry'">Expense Entry</span>
                        </h5>
                        <a th:href="@{/expenses}" class="btn btn-outline-secondary btn-sm">
                            <i class="bi bi-arrow-left me-1"></i> Back
                        </a>
                    </div>

                    <form th:action="@{/expenses/save}" th:object="${expense}" method="post">
                        <input type="hidden" th:field="*{id}">

                        <div class="row g-3">
                            <div class="col-md-6">
                                <label for="category" class="form-label fw-semibold small">Expense Category <span class="text-danger">*</span></label>
                                <select id="category" th:field="*{category}" class="form-select"
                                        th:classappend="${#fields.hasErrors('category')} ? 'is-invalid' : ''" required>
                                    <option value="">-- Choose Category --</option>
                                    <option th:each="cat : ${categories}" th:value="${cat}" th:text="${cat.displayName}"></option>
                                </select>
                                <div class="invalid-feedback" th:errors="*{category}"></div>
                            </div>

                            <div class="col-md-6">
                                <label for="expenseDate" class="form-label fw-semibold small">Expense Date <span class="text-danger">*</span></label>
                                <input type="date" id="expenseDate" th:field="*{expenseDate}" class="form-control" required>
                            </div>

                            <div class="col-12">
                                <label for="amount" class="form-label fw-semibold small">Amount Incurred (₹) <span class="text-danger">*</span></label>
                                <div class="input-group">
                                    <span class="input-group-text">₹</span>
                                    <input type="number" step="0.01" min="0.01" id="amount" th:field="*{amount}" class="form-control"
                                           th:classappend="${#fields.hasErrors('amount')} ? 'is-invalid' : ''" placeholder="0.00" required>
                                </div>
                                <div class="invalid-feedback d-block" th:errors="*{amount}"></div>
                            </div>

                            <div class="col-12">
                                <label for="description" class="form-label fw-semibold small">Description / Bill Remarks</label>
                                <textarea id="description" th:field="*{description}" class="form-control" rows="3"
                                          placeholder="e.g. Electricity bill payment for Main Showroom for October 2026"></textarea>
                            </div>

                            <div class="col-12 text-end pt-3 border-top">
                                <a th:href="@{/expenses}" class="btn btn-light border me-2">Cancel</a>
                                <button type="submit" class="btn btn-primary px-4 shadow-sm">
                                    <i class="bi bi-check2 me-1"></i> Save Expense
                                </button>
                            </div>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
