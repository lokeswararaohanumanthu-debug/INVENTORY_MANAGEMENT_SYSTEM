<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head></head>
<body>
<header th:fragment="header(pageTitle)" class="app-header">
    <div class="d-flex align-items-center gap-3">
        <h4 class="mb-0 fw-bold text-dark" th:text="${pageTitle}">Page Title</h4>
    </div>
    <div class="d-flex align-items-center gap-2">
        <a th:href="@{/sales/billing}" class="btn btn-primary btn-sm d-flex align-items-center gap-1 shadow-sm">
            <i class="bi bi-plus-circle"></i>
            <span>New Bill</span>
        </a>
        <a th:href="@{/purchases/new}" class="btn btn-outline-secondary btn-sm d-flex align-items-center gap-1">
            <i class="bi bi-cart-plus"></i>
            <span>Restock</span>
        </a>
    </div>
</header>
</body>
</html>
