<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stock Movements - INVENTRA</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<div th:replace="~{fragments/sidebar :: sidebar}"></div>

<div class="app-main">
    <div th:replace="~{fragments/header :: header('Stock Movements Audit Trail')}"></div>

    <div class="page-container">
        <div class="d-flex align-items-center justify-content-between mb-4">
            <h5 class="fw-bold mb-0">Complete Inventory In/Out Audit Log</h5>
            <a th:href="@{/inventory}" class="btn btn-outline-secondary btn-sm">
                <i class="bi bi-arrow-left me-1"></i> Back to Inventory
            </a>
        </div>

        <div class="table-custom">
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead>
                    <tr>
                        <th>Date & Time</th>
                        <th>Product</th>
                        <th>Movement Type</th>
                        <th class="text-center">Quantity</th>
                        <th class="text-center">Stock Audit</th>
                        <th>Reference #</th>
                        <th>Notes</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="m : ${movements}">
                        <td class="small text-muted" th:text="${#temporals.format(m.createdAt, 'yyyy-MM-dd HH:mm:ss')}">2026-11-04 12:00:00</td>
                        <td>
                            <div class="fw-semibold text-dark" th:text="${m.product.name}">Product</div>
                            <small class="text-muted" th:text="${m.product.productCode}">MOB-001</small>
                        </td>
                        <td>
                            <span class="badge"
                                  th:classappend="${m.movementType.name() == 'PURCHASE_IN'} ? 'bg-success' : (${m.movementType.name() == 'SALE_OUT'} ? 'bg-primary' : 'bg-warning text-dark')"
                                  th:text="${m.movementType.displayName}">Purchase</span>
                        </td>
                        <td class="text-center fw-bold"
                            th:classappend="${m.quantity > 0} ? 'text-success' : 'text-danger'"
                            th:text="${m.quantity > 0 ? '+' + m.quantity : m.quantity}">+5</td>
                        <td class="text-center small">
                            <span class="text-muted" th:text="${m.stockBefore}">10</span>
                            <i class="bi bi-arrow-right mx-1 text-secondary"></i>
                            <span class="fw-bold text-dark" th:text="${m.stockAfter}">15</span>
                        </td>
                        <td class="small font-monospace" th:text="${m.referenceNumber}">REF-001</td>
                        <td class="small text-muted" th:text="${m.notes}">Stock change notes</td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(movements)}">
                        <td colspan="7" class="text-center py-4 text-muted">No stock movements recorded.</td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
