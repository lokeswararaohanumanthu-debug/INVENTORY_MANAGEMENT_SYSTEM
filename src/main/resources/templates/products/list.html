<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Products Catalog - MobileZone Pro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<div th:replace="~{fragments/sidebar :: sidebar}"></div>

<div class="app-main">
    <div th:replace="~{fragments/header :: header('Products Catalog')}"></div>

    <div class="page-container">
        <div th:replace="~{fragments/alerts :: alerts}"></div>

        <!-- Filter and Search Bar -->
        <div class="content-card mb-4">
            <div class="row g-3 align-items-center">
                <div class="col-md-5">
                    <form th:action="@{/products}" method="get" class="d-flex gap-2">
                        <div class="input-group">
                            <span class="input-group-text bg-white"><i class="bi bi-search text-muted"></i></span>
                            <input type="text" name="search" class="form-control" placeholder="Search by name, brand, model or code..." th:value="${searchKeyword}">
                        </div>
                        <button type="submit" class="btn btn-primary">Search</button>
                        <a th:href="@{/products}" class="btn btn-outline-secondary" th:if="${searchKeyword != null or selectedCategory != null}">Reset</a>
                    </form>
                </div>
                <div class="col-md-4">
                    <form th:action="@{/products}" method="get" id="categoryForm">
                        <select name="category" class="form-select" onchange="document.getElementById('categoryForm').submit()">
                            <option value="">-- All Categories --</option>
                            <option th:each="cat : ${categories}"
                                    th:value="${cat}"
                                    th:text="${cat.displayName}"
                                    th:selected="${selectedCategory == cat}"></option>
                        </select>
                    </form>
                </div>
                <div class="col-md-3 text-md-end">
                    <a th:href="@{/products/new}" class="btn btn-primary shadow-sm">
                        <i class="bi bi-plus-lg me-1"></i> Add New Product
                    </a>
                </div>
            </div>
        </div>

        <!-- Products Table -->
        <div class="table-custom">
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead>
                    <tr>
                        <th>Code</th>
                        <th>Product Name</th>
                        <th>Brand & Model</th>
                        <th>Category</th>
                        <th class="text-end">Cost (₹)</th>
                        <th class="text-end">Selling (₹)</th>
                        <th class="text-center">Stock</th>
                        <th class="text-center">Status</th>
                        <th class="text-center">Actions</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="product : ${products}">
                        <td class="fw-bold font-monospace text-primary" th:text="${product.productCode}">MOB-001</td>
                        <td>
                            <a th:href="@{'/products/view/' + ${product.id}}" class="text-decoration-none fw-semibold text-dark" th:text="${product.name}">iPhone 15 Pro</a>
                        </td>
                        <td>
                            <span class="badge bg-light text-dark border" th:text="${product.brand}">Apple</span>
                            <span class="small text-muted ms-1" th:text="${product.model}">256GB Black</span>
                        </td>
                        <td class="small text-secondary" th:text="${product.category.displayName}">Mobile Phone</td>
                        <td class="text-end" th:text="${#numbers.formatDecimal(product.purchasePrice, 1, 'COMMA', 2, 'POINT')}">110,000.00</td>
                        <td class="text-end fw-bold text-success" th:text="${#numbers.formatDecimal(product.sellingPrice, 1, 'COMMA', 2, 'POINT')}">125,000.00</td>
                        <td class="text-center">
                            <span class="badge"
                                  th:classappend="${product.isOutOfStock()} ? 'bg-danger' : (${product.isLowStock()} ? 'bg-warning text-dark' : 'bg-success')"
                                  th:text="${product.quantity} + ' in stock'">
                                10 in stock
                            </span>
                        </td>
                        <td class="text-center">
                            <span class="badge bg-success-subtle text-success" th:if="${product.active}">Active</span>
                            <span class="badge bg-secondary-subtle text-secondary" th:unless="${product.active}">Inactive</span>
                        </td>
                        <td class="text-center">
                            <div class="btn-group btn-group-sm">
                                <a th:href="@{'/products/view/' + ${product.id}}" class="btn btn-outline-secondary" title="View details">
                                    <i class="bi bi-eye"></i>
                                </a>
                                <a th:href="@{'/products/edit/' + ${product.id}}" class="btn btn-outline-primary" title="Edit product">
                                    <i class="bi bi-pencil"></i>
                                </a>
                                <form th:if="${product.active}" th:action="@{'/products/deactivate/' + ${product.id}}" method="post" class="d-inline"
                                      onsubmit="return confirm('Are you sure you want to deactivate this product?');">
                                    <button type="submit" class="btn btn-outline-danger" title="Deactivate">
                                        <i class="bi bi-slash-circle"></i>
                                    </button>
                                </form>
                            </div>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(products)}">
                        <td colspan="9" class="text-center text-muted py-5">
                            <i class="bi bi-inbox fs-1 d-block mb-2"></i>
                            No products found matching the criteria.
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>

    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
