<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Change Account Password - INVENTRA</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<div th:replace="~{fragments/sidebar :: sidebar}"></div>

<div class="app-main">
    <div th:replace="~{fragments/header :: header('My Account & Password Security')}"></div>

    <div class="page-container">
        <div th:replace="~{fragments/alerts :: alerts}"></div>

        <div class="row justify-content-center">
            <div class="col-lg-6">
                <div class="content-card">
                    <div class="content-card-header">
                        <div class="d-flex align-items-center gap-2">
                            <span class="metric-icon-box icon-blue" style="width: 38px; height: 38px; font-size: 1.1rem;">
                                <i class="bi bi-key-fill"></i>
                            </span>
                            <div>
                                <h5 class="content-card-title mb-0">Update Account Password</h5>
                                <small class="text-muted">Passwords are encrypted using BCrypt before storage</small>
                            </div>
                        </div>
                    </div>

                    <div th:if="${currentUser != null}" class="border rounded-3 p-3 bg-light mb-3 small">
                        <div class="d-flex align-items-center justify-content-between mb-1">
                            <span class="text-muted">Employee Name:</span>
                            <strong class="text-dark" th:text="${currentUser.fullName}">Name</strong>
                        </div>
                        <div class="d-flex align-items-center justify-content-between mb-1">
                            <span class="text-muted">User ID:</span>
                            <code class="fw-bold text-primary" th:text="${currentUser.username}">user</code>
                        </div>
                        <div class="d-flex align-items-center justify-content-between">
                            <span class="text-muted">Assigned Role:</span>
                            <span class="role-badge" th:classappend="${currentUser.role.badgeClass}" th:text="${currentUser.role.displayName}">Role</span>
                        </div>
                    </div>

                    <form th:action="@{/profile/change-password}" method="post">
                        <div class="mb-3">
                            <label class="form-label small fw-bold">Current Password <span class="text-danger">*</span></label>
                            <input type="password" name="currentPassword" class="form-control" required autocomplete="current-password">
                        </div>
                        <div class="mb-3">
                            <label class="form-label small fw-bold">New Password <span class="text-danger">*</span></label>
                            <input type="password" name="newPassword" class="form-control" required minlength="6" autocomplete="new-password">
                        </div>
                        <div class="mb-4">
                            <label class="form-label small fw-bold">Confirm New Password <span class="text-danger">*</span></label>
                            <input type="password" name="confirmPassword" class="form-control" required minlength="6" autocomplete="new-password">
                        </div>
                        <div class="d-flex justify-content-end gap-2">
                            <a th:href="@{/dashboard}" class="btn btn-light">Cancel</a>
                            <button type="submit" class="btn btn-primary px-4">
                                <i class="bi bi-shield-check me-1"></i> Update Password
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
