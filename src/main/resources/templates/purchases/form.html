<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>New Purchase Order - MobileZone Pro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<div th:replace="~{fragments/sidebar :: sidebar}"></div>

<div class="app-main">
    <div th:replace="~{fragments/header :: header('Record Purchase & Restock')}"></div>

    <div class="page-container">
        <div class="content-card">
            <div class="content-card-header">
                <h5 class="content-card-title"><i class="bi bi-cart-plus text-primary me-2"></i>New Supplier Restocking Order</h5>
                <a th:href="@{/purchases}" class="btn btn-outline-secondary btn-sm">
                    <i class="bi bi-arrow-left me-1"></i> Back
                </a>
            </div>

            <form th:action="@{/purchases/save}" th:object="${purchase}" method="post" id="purchaseForm">
                <div class="row g-3 mb-4">
                    <div class="col-md-5">
                        <label for="supplierId" class="form-label fw-semibold small">Supplier / Vendor <span class="text-danger">*</span></label>
                        <select id="supplierId" th:field="*{supplierId}" class="form-select"
                                th:classappend="${#fields.hasErrors('supplierId')} ? 'is-invalid' : ''" required>
                            <option value="">-- Choose Supplier --</option>
                            <option th:each="s : ${suppliers}" th:value="${s.id}" th:text="${s.name}"></option>
                        </select>
                        <div class="invalid-feedback" th:errors="*{supplierId}"></div>
                    </div>

                    <div class="col-md-3">
                        <label for="purchaseDate" class="form-label fw-semibold small">Purchase Date <span class="text-danger">*</span></label>
                        <input type="date" id="purchaseDate" th:field="*{purchaseDate}" class="form-control" required>
                    </div>

                    <div class="col-md-4">
                        <label for="notes" class="form-label fw-semibold small">Invoice / Gate Pass Reference</label>
                        <input type="text" id="notes" th:field="*{notes}" class="form-control" placeholder="e.g. Vendor Invoice #4928">
                    </div>
                </div>

                <!-- Products Table -->
                <div class="border rounded-3 p-3 mb-4 bg-light">
                    <div class="d-flex align-items-center justify-content-between mb-2">
                        <h6 class="fw-bold mb-0 text-dark"><i class="bi bi-boxes me-1 text-primary"></i>Purchase Items</h6>
                        <button type="button" class="btn btn-outline-primary btn-sm" id="addItemBtn">
                            <i class="bi bi-plus-circle me-1"></i> Add Another Product
                        </button>
                    </div>

                    <div class="table-responsive">
                        <table class="table table-bordered bg-white mb-0" id="itemsTable">
                            <thead class="table-light">
                            <tr>
                                <th style="width: 45%;">Product <span class="text-danger">*</span></th>
                                <th style="width: 15%;">Quantity <span class="text-danger">*</span></th>
                                <th style="width: 20%;">Unit Cost (₹) <span class="text-danger">*</span></th>
                                <th style="width: 15%;" class="text-end">Item Total (₹)</th>
                                <th style="width: 5%;" class="text-center">Action</th>
                            </tr>
                            </thead>
                            <tbody id="itemsBody">
                            <tr class="item-row" th:each="item, stat : *{items}">
                                <td>
                                    <select th:field="*{items[__${stat.index}__].productId}" class="form-select product-select" required onchange="handleProductChange(this)">
                                        <option value="">-- Select Product --</option>
                                        <option th:each="p : ${products}"
                                                th:value="${p.id}"
                                                th:data-price="${p.purchasePrice}"
                                                th:text="${p.name} + ' (' + ${p.brand} + ' - ' + ${p.productCode} + ')'"></option>
                                    </select>
                                </td>
                                <td>
                                    <input type="number" min="1" th:field="*{items[__${stat.index}__].quantity}" class="form-control qty-input" value="1" required oninput="calculateRow(this)">
                                </td>
                                <td>
                                    <input type="number" step="0.01" min="0.01" th:field="*{items[__${stat.index}__].unitPrice}" class="form-control price-input" placeholder="0.00" required oninput="calculateRow(this)">
                                </td>
                                <td class="text-end fw-bold align-middle item-total">₹0.00</td>
                                <td class="text-center align-middle">
                                    <button type="button" class="btn btn-sm btn-outline-danger" onclick="removeRow(this)">
                                        <i class="bi bi-trash"></i>
                                    </button>
                                </td>
                            </tr>
                            </tbody>
                            <tfoot class="table-light">
                            <tr>
                                <th colspan="3" class="text-end fs-6">Grand Total:</th>
                                <th class="text-end fs-5 text-primary fw-bold" id="grandTotal">₹0.00</th>
                                <th></th>
                            </tr>
                            </tfoot>
                        </table>
                    </div>
                </div>

                <div class="text-end">
                    <a th:href="@{/purchases}" class="btn btn-light border me-2">Cancel</a>
                    <button type="submit" class="btn btn-primary px-4 shadow-sm">
                        <i class="bi bi-check-circle me-1"></i> Confirm & Restock Inventory
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
    function handleProductChange(selectElem) {
        const selected = selectElem.options[selectElem.selectedIndex];
        const price = selected.getAttribute('data-price');
        const row = selectElem.closest('.item-row');
        const priceInput = row.querySelector('.price-input');
        if (price) {
            priceInput.value = price;
        }
        calculateRow(priceInput);
    }

    function calculateRow(inputElem) {
        const row = inputElem.closest('.item-row');
        const qty = parseFloat(row.querySelector('.qty-input').value) || 0;
        const price = parseFloat(row.querySelector('.price-input').value) || 0;
        const total = qty * price;
        row.querySelector('.item-total').textContent = '₹' + total.toLocaleString('en-IN', {minimumFractionDigits: 2, maximumFractionDigits: 2});
        updateGrandTotal();
    }

    function updateGrandTotal() {
        let sum = 0;
        document.querySelectorAll('.item-row').forEach(row => {
            const qty = parseFloat(row.querySelector('.qty-input').value) || 0;
            const price = parseFloat(row.querySelector('.price-input').value) || 0;
            sum += (qty * price);
        });
        document.getElementById('grandTotal').textContent = '₹' + sum.toLocaleString('en-IN', {minimumFractionDigits: 2, maximumFractionDigits: 2});
    }

    function removeRow(btn) {
        const rows = document.querySelectorAll('.item-row');
        if (rows.length > 1) {
            btn.closest('.item-row').remove();
            reindexRows();
            updateGrandTotal();
        } else {
            alert('At least one item is required in the purchase.');
        }
    }

    function reindexRows() {
        document.querySelectorAll('.item-row').forEach((row, index) => {
            row.querySelector('.product-select').name = `items[${index}].productId`;
            row.querySelector('.qty-input').name = `items[${index}].quantity`;
            row.querySelector('.price-input').name = `items[${index}].unitPrice`;
        });
    }

    document.getElementById('addItemBtn').addEventListener('click', function () {
        const tbody = document.getElementById('itemsBody');
        const firstRow = tbody.querySelector('.item-row');
        const newRow = firstRow.cloneNode(true);

        // Reset inputs
        newRow.querySelector('.product-select').selectedIndex = 0;
        newRow.querySelector('.qty-input').value = '1';
        newRow.querySelector('.price-input').value = '';
        newRow.querySelector('.item-total').textContent = '₹0.00';

        tbody.appendChild(newRow);
        reindexRows();
    });

    // Calculate initial row on load
    document.addEventListener("DOMContentLoaded", function () {
        document.querySelectorAll('.item-row').forEach(row => {
            const input = row.querySelector('.qty-input');
            if (input) calculateRow(input);
        });
    });
</script>
</body>
</html>
