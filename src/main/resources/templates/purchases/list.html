<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Purchase Orders - MobileZone Pro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<div th:replace="~{fragments/sidebar :: sidebar}"></div>

<div class="app-main">
    <div th:replace="~{fragments/header :: header('Purchase & Restocking Orders')}"></div>

    <div class="page-container">
        <div th:replace="~{fragments/alerts :: alerts}"></div>

        <div class="d-flex align-items-center justify-content-between mb-4">
            <div>
                <h5 class="fw-bold mb-1">Supplier Procurement History</h5>
                <p class="text-muted small mb-0">Record and track inventory batches received from vendors.</p>
            </div>
            <a th:href="@{/purchases/new}" class="btn btn-primary shadow-sm">
                <i class="bi bi-cart-plus me-1"></i> New Purchase Order
            </a>
        </div>

        <div class="table-custom">
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead>
                    <tr>
                        <th>PO Number</th>
                        <th>Supplier</th>
                        <th>Purchase Date</th>
                        <th class="text-center">Items Count</th>
                        <th class="text-end">Total Amount (₹)</th>
                        <th>Notes</th>
                        <th class="text-center">Action</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="p : ${purchases}">
                        <td class="font-monospace fw-bold text-primary" th:text="${p.purchaseNumber}">PO-20261104-1001</td>
                        <td class="fw-semibold text-dark" th:text="${p.supplier.name}">Supplier</td>
                        <td class="small text-muted" th:text="${p.purchaseDate}">2026-11-04</td>
                        <td class="text-center">
                            <span class="badge bg-light text-dark border" th:text="${#lists.size(p.items)} + ' items'">3 items</span>
                        </td>
                        <td class="text-end fw-bold text-dark fs-6" th:text="'₹' + ${#numbers.formatDecimal(p.totalAmount, 1, 'COMMA', 2, 'POINT')}">₹0.00</td>
                        <td class="small text-muted text-truncate" style="max-width: 200px;" th:text="${p.notes} ?: '-'">-</td>
                        <td class="text-center">
                            <a th:href="@{'/purchases/view/' + ${p.id}}" class="btn btn-sm btn-outline-primary" title="View PO Details">
                                <i class="bi bi-eye"></i> View
                            </a>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(purchases)}">
                        <td colspan="7" class="text-center py-4 text-muted">No purchase orders recorded yet.</td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
