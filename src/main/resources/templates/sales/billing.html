<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>POS & Billing Counter - MobileZone Pro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<div th:replace="~{fragments/sidebar :: sidebar}"></div>

<div class="app-main">
    <div th:replace="~{fragments/header :: header('Showroom POS & Billing Counter')}"></div>

    <div class="page-container">
        <div th:replace="~{fragments/alerts :: alerts}"></div>

        <form th:action="@{/sales/save}" th:object="${sale}" method="post" id="billingForm">
            <div class="row g-4">
                <!-- Left: Items & Cart -->
                <div class="col-lg-8">
                    <div class="content-card">
                        <div class="content-card-header">
                            <h5 class="content-card-title"><i class="bi bi-cart3 text-primary me-2"></i>Cart Items</h5>
                            <button type="button" class="btn btn-outline-primary btn-sm" id="addItemBtn">
                                <i class="bi bi-plus-circle me-1"></i> Add Another Item
                            </button>
                        </div>

                        <div class="table-responsive">
                            <table class="table table-bordered align-middle bg-white" id="itemsTable">
                                <thead class="table-light">
                                <tr>
                                    <th style="width: 45%;">Product <span class="text-danger">*</span></th>
                                    <th style="width: 15%;">Qty <span class="text-danger">*</span></th>
                                    <th style="width: 18%;">Unit Price (₹)</th>
                                    <th style="width: 17%;" class="text-end">Total (₹)</th>
                                    <th style="width: 5%;" class="text-center">Action</th>
                                </tr>
                                </thead>
                                <tbody id="itemsBody">
                                <tr class="item-row" th:each="item, stat : *{items}">
                                    <td>
                                        <select th:field="*{items[__${stat.index}__].productId}" class="form-select product-select" required onchange="handleProductSelect(this)">
                                            <option value="">-- Choose Product --</option>
                                            <option th:each="p : ${products}"
                                                    th:value="${p.id}"
                                                    th:data-price="${p.sellingPrice}"
                                                    th:data-stock="${p.quantity}"
                                                    th:text="${p.name} + ' (' + ${p.brand} + ') - Stock: ' + ${p.quantity}"></option>
                                        </select>
                                        <div class="small text-muted stock-indicator mt-1"></div>
                                    </td>
                                    <td>
                                        <input type="number" min="1" th:field="*{items[__${stat.index}__].quantity}" class="form-control qty-input" value="1" required oninput="calculateRow(this)">
                                    </td>
                                    <td>
                                        <input type="number" step="0.01" min="0.01" th:field="*{items[__${stat.index}__].unitPrice}" class="form-control price-input" placeholder="0.00" required oninput="calculateRow(this)">
                                    </td>
                                    <td class="text-end fw-bold align-middle item-total">₹0.00</td>
                                    <td class="text-center align-middle">
                                        <button type="button" class="btn btn-sm btn-outline-danger" onclick="removeRow(this)">
                                            <i class="bi bi-trash"></i>
                                        </button>
                                    </td>
                                </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>

                <!-- Right: Customer, Payment & Checkout summary -->
                <div class="col-lg-4">
                    <div class="content-card">
                        <div class="content-card-header">
                            <h5 class="content-card-title"><i class="bi bi-wallet2 text-success me-2"></i>Customer & Payment</h5>
                        </div>

                        <!-- Customer Name -->
                        <div class="mb-3">
                            <label for="customerName" class="form-label small fw-semibold">Customer Name</label>
                            <input type="text" id="customerName" th:field="*{customerName}" class="form-control" placeholder="Walk-in Customer">
                        </div>

                        <!-- Customer Phone -->
                        <div class="mb-3">
                            <label for="customerPhone" class="form-label small fw-semibold">Phone Number</label>
                            <input type="tel" id="customerPhone" th:field="*{customerPhone}" class="form-control" placeholder="e.g. 9876543210">
                        </div>

                        <!-- Payment Method -->
                        <div class="mb-3">
                            <label for="paymentMethod" class="form-label small fw-semibold">Payment Mode</label>
                            <select id="paymentMethod" th:field="*{paymentMethod}" class="form-select">
                                <option value="CASH">Cash</option>
                                <option value="CARD">Debit / Credit Card</option>
                                <option value="UPI">UPI / QR Code</option>
                                <option value="NET_BANKING">Net Banking</option>
                            </select>
                        </div>

                        <hr>

                        <!-- Financial Summary Box -->
                        <div class="bg-light p-3 rounded-3 mb-3">
                            <div class="d-flex justify-content-between mb-2">
                                <span class="text-muted">Subtotal:</span>
                                <span class="fw-bold" id="subtotalDisplay">₹0.00</span>
                            </div>

                            <div class="d-flex justify-content-between align-items-center mb-2">
                                <span class="text-muted">Discount (₹):</span>
                                <input type="number" step="0.01" min="0" id="discountInput" th:field="*{discount}"
                                       class="form-control form-control-sm text-end" style="width: 120px;"
                                       value="0.00" oninput="updateGrandTotal()">
                            </div>

                            <div class="border-top pt-2 mt-2 d-flex justify-content-between align-items-center">
                                <span class="fw-bold fs-6">Net Payable:</span>
                                <span class="fw-bold fs-4 text-success" id="netAmountDisplay">₹0.00</span>
                            </div>
                        </div>

                        <!-- Bill Notes -->
                        <div class="mb-3">
                            <label for="notes" class="form-label small text-muted">Notes / Warranty Remarks</label>
                            <input type="text" id="notes" th:field="*{notes}" class="form-control form-control-sm" placeholder="e.g. 1 Year Brand Warranty">
                        </div>

                        <button type="submit" class="btn btn-success w-100 py-2 fs-6 fw-bold shadow">
                            <i class="bi bi-printer me-1"></i> Complete Sale & Generate Bill
                        </button>
                    </div>
                </div>
            </div>
        </form>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
    function handleProductSelect(selectElem) {
        const selected = selectElem.options[selectElem.selectedIndex];
        const price = selected.getAttribute('data-price');
        const stock = selected.getAttribute('data-stock');
        const row = selectElem.closest('.item-row');
        const priceInput = row.querySelector('.price-input');
        const qtyInput = row.querySelector('.qty-input');
        const indicator = row.querySelector('.stock-indicator');

        if (price) {
            priceInput.value = price;
        }

        if (stock) {
            const stockNum = parseInt(stock);
            if (stockNum <= 0) {
                indicator.innerHTML = '<span class="text-danger fw-bold"><i class="bi bi-x-circle"></i> Out of stock!</span>';
                qtyInput.max = 0;
            } else {
                indicator.innerHTML = `<span class="text-muted"><i class="bi bi-info-circle"></i> Available Stock: <strong>${stockNum}</strong></span>`;
                qtyInput.max = stockNum;
            }
        } else {
            indicator.innerHTML = '';
        }

        calculateRow(priceInput);
    }

    function calculateRow(inputElem) {
        const row = inputElem.closest('.item-row');
        const qty = parseFloat(row.querySelector('.qty-input').value) || 0;
        const price = parseFloat(row.querySelector('.price-input').value) || 0;
        const total = qty * price;
        row.querySelector('.item-total').textContent = '₹' + total.toLocaleString('en-IN', {minimumFractionDigits: 2, maximumFractionDigits: 2});
        updateGrandTotal();
    }

    function updateGrandTotal() {
        let subtotal = 0;
        document.querySelectorAll('.item-row').forEach(row => {
            const qty = parseFloat(row.querySelector('.qty-input').value) || 0;
            const price = parseFloat(row.querySelector('.price-input').value) || 0;
            subtotal += (qty * price);
        });

        const discount = parseFloat(document.getElementById('discountInput').value) || 0;
        let net = subtotal - discount;
        if (net < 0) net = 0;

        document.getElementById('subtotalDisplay').textContent = '₹' + subtotal.toLocaleString('en-IN', {minimumFractionDigits: 2, maximumFractionDigits: 2});
        document.getElementById('netAmountDisplay').textContent = '₹' + net.toLocaleString('en-IN', {minimumFractionDigits: 2, maximumFractionDigits: 2});
    }

    function removeRow(btn) {
        const rows = document.querySelectorAll('.item-row');
        if (rows.length > 1) {
            btn.closest('.item-row').remove();
            reindexRows();
            updateGrandTotal();
        } else {
            alert('At least one item is required in the bill.');
        }
    }

    function reindexRows() {
        document.querySelectorAll('.item-row').forEach((row, index) => {
            row.querySelector('.product-select').name = `items[${index}].productId`;
            row.querySelector('.qty-input').name = `items[${index}].quantity`;
            row.querySelector('.price-input').name = `items[${index}].unitPrice`;
        });
    }

    document.getElementById('addItemBtn').addEventListener('click', function () {
        const tbody = document.getElementById('itemsBody');
        const firstRow = tbody.querySelector('.item-row');
        const newRow = firstRow.cloneNode(true);

        newRow.querySelector('.product-select').selectedIndex = 0;
        newRow.querySelector('.stock-indicator').innerHTML = '';
        newRow.querySelector('.qty-input').value = '1';
        newRow.querySelector('.price-input').value = '';
        newRow.querySelector('.item-total').textContent = '₹0.00';

        tbody.appendChild(newRow);
        reindexRows();
    });

    document.addEventListener("DOMContentLoaded", function () {
        document.querySelectorAll('.item-row').forEach(row => {
            const input = row.querySelector('.qty-input');
            if (input) calculateRow(input);
        });
    });
</script>
</body>
</html>
