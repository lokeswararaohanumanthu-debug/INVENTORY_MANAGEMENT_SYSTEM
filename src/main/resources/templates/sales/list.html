<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sales Invoices - MobileZone Pro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<div th:replace="~{fragments/sidebar :: sidebar}"></div>

<div class="app-main">
    <div th:replace="~{fragments/header :: header('Sales & Billing History')}"></div>

    <div class="page-container">
        <div th:replace="~{fragments/alerts :: alerts}"></div>

        <div class="d-flex align-items-center justify-content-between mb-4">
            <div>
                <h5 class="fw-bold mb-1">Customer Sales Ledger</h5>
                <p class="text-muted small mb-0">Today's Total Sales: <strong class="text-success" th:text="'₹' + ${#numbers.formatDecimal(todayTotal, 1, 'COMMA', 2, 'POINT')}">₹0.00</strong></p>
            </div>
            <a th:href="@{/sales/billing}" class="btn btn-primary shadow-sm">
                <i class="bi bi-receipt me-1"></i> Open Billing Counter (POS)
            </a>
        </div>

        <div class="table-custom">
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead>
                    <tr>
                        <th>Bill #</th>
                        <th>Date</th>
                        <th>Customer Name</th>
                        <th>Phone</th>
                        <th>Payment</th>
                        <th class="text-end">Subtotal (₹)</th>
                        <th class="text-end">Discount (₹)</th>
                        <th class="text-end">Net Paid (₹)</th>
                        <th class="text-center">Action</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="s : ${sales}">
                        <td class="font-monospace fw-bold text-primary" th:text="${s.billNumber}">BILL-20261104-1001</td>
                        <td class="small text-muted" th:text="${s.saleDate}">2026-11-04</td>
                        <td class="fw-semibold text-dark" th:text="${s.customerName}">Customer</td>
                        <td class="small text-muted" th:text="${s.customerPhone} ?: '-'">-</td>
                        <td>
                            <span class="badge bg-light text-dark border" th:text="${s.paymentMethod}">CASH</span>
                        </td>
                        <td class="text-end text-muted small" th:text="${#numbers.formatDecimal(s.totalAmount, 1, 'COMMA', 2, 'POINT')}">0.00</td>
                        <td class="text-end text-danger small" th:text="'-₹' + ${#numbers.formatDecimal(s.discount, 1, 'COMMA', 2, 'POINT')}">-₹0.00</td>
                        <td class="text-end fw-bold text-success fs-6" th:text="'₹' + ${#numbers.formatDecimal(s.netAmount, 1, 'COMMA', 2, 'POINT')}">₹0.00</td>
                        <td class="text-center">
                            <a th:href="@{'/sales/view/' + ${s.id}}" class="btn btn-sm btn-outline-primary" title="View / Print Invoice">
                                <i class="bi bi-printer"></i> Invoice
                            </a>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(sales)}">
                        <td colspan="9" class="text-center py-4 text-muted">No sales invoices generated yet.</td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
