<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Suppliers - MobileZone Pro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<div th:replace="~{fragments/sidebar :: sidebar}"></div>

<div class="app-main">
    <div th:replace="~{fragments/header :: header('Suppliers Management')}"></div>

    <div class="page-container">
        <div th:replace="~{fragments/alerts :: alerts}"></div>

        <div class="content-card mb-4">
            <div class="row g-3 align-items-center">
                <div class="col-md-6">
                    <form th:action="@{/suppliers}" method="get" class="d-flex gap-2">
                        <div class="input-group">
                            <span class="input-group-text bg-white"><i class="bi bi-search text-muted"></i></span>
                            <input type="text" name="search" class="form-control" placeholder="Search supplier by name..." th:value="${searchKeyword}">
                        </div>
                        <button type="submit" class="btn btn-primary">Search</button>
                    </form>
                </div>
                <div class="col-md-6 text-md-end">
                    <a th:href="@{/suppliers/new}" class="btn btn-primary shadow-sm">
                        <i class="bi bi-plus-lg me-1"></i> Add New Supplier
                    </a>
                </div>
            </div>
        </div>

        <div class="table-custom">
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead>
                    <tr>
                        <th>Supplier Name</th>
                        <th>Contact Person</th>
                        <th>Phone</th>
                        <th>Email</th>
                        <th>Address</th>
                        <th class="text-center">Status</th>
                        <th class="text-center">Actions</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="s : ${suppliers}">
                        <td class="fw-bold text-dark" th:text="${s.name}">Supplier Company</td>
                        <td th:text="${s.contactPerson}">John Doe</td>
                        <td class="small" th:text="${s.phone}">+91 9876543210</td>
                        <td class="small text-muted" th:text="${s.email}">supplier@example.com</td>
                        <td class="small text-muted text-truncate" style="max-width: 200px;" th:text="${s.address}">Address</td>
                        <td class="text-center">
                            <span class="badge bg-success-subtle text-success" th:if="${s.active}">Active</span>
                            <span class="badge bg-secondary-subtle text-secondary" th:unless="${s.active}">Inactive</span>
                        </td>
                        <td class="text-center">
                            <div class="btn-group btn-group-sm">
                                <a th:href="@{'/suppliers/edit/' + ${s.id}}" class="btn btn-outline-primary" title="Edit">
                                    <i class="bi bi-pencil"></i>
                                </a>
                                <form th:if="${s.active}" th:action="@{'/suppliers/deactivate/' + ${s.id}}" method="post" class="d-inline"
                                      onsubmit="return confirm('Deactivate this supplier?');">
                                    <button type="submit" class="btn btn-outline-danger" title="Deactivate">
                                        <i class="bi bi-slash-circle"></i>
                                    </button>
                                </form>
                            </div>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(suppliers)}">
                        <td colspan="7" class="text-center py-4 text-muted">No suppliers found.</td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
